<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suhag's Ultra Elite Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-gold: #ffcc00;
            --neon-blue: #00d4ff;
            --neon-pink: #ff007f;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Poppins', sans-serif;
            background: #020205; color: white;
        }

        /* --- ভাসমান টেক্সট --- */
        .bg-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
        }
        .float-text {
            position: absolute; font-weight: 900; text-transform: uppercase;
            white-space: nowrap; animation: floatUp linear infinite;
            color: rgba(255, 255, 255, 0.12);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
        @keyframes floatUp {
            from { transform: translateY(110vh) rotate(-10deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            to { transform: translateY(-20vh) rotate(10deg); opacity: 0; }
        }

        /* --- ধাপ ১: এন্ট্রেন্স স্ক্রিন --- */
        #wish-screen {
            position: relative; height: 100vh; display: flex; 
            align-items: center; justify-content: center; z-index: 10;
            background: radial-gradient(circle at center, #0a0a20 0%, #000 100%);
        }

        .envelope-container { text-align: center; transition: 0.5s; }
        .envelope {
            width: 280px; height: 170px; background: linear-gradient(145deg, #b8860b, #8b6508);
            border-radius: 12px; position: relative; border: 2px solid var(--neon-gold);
            box-shadow: 0 0 30px rgba(184, 134, 11, 0.4);
        }

        .seal {
            width: 70px; height: 70px; background: #ff0040; border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 4px solid #fff; box-shadow: 0 0 20px #ff0040;
            display: flex; align-items: center; justify-content: center; font-size: 30px;
            cursor: pointer; animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 40px #ff0040; }
        }

        .glass-card {
            display: none; background: var(--glass); backdrop-filter: blur(20px);
            padding: 40px 25px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1);
            width: 85%; max-width: 360px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6); animation: zoomIn 0.5s ease;
        }

        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- ধাপ ২: গেম স্ক্রিন --- */
        #game-screen {
            display: none; height: 100vh; width: 100%;
            background: #05050a; position: relative;
        }

        .stats-bar {
            position: absolute; top: 30px; width: 90%; left: 5%;
            display: flex; justify-content: space-between; font-family: 'Orbitron', sans-serif;
            z-index: 1000;
        }

        .stat-item { background: var(--glass); padding: 10px 15px; border-radius: 10px; border-bottom: 2px solid var(--neon-blue); }

        #player {
            width: 75px; height: 95px;
            background: url('https://comprehensive-white-eicmrzknza.edgeone.app/1774265565775.jpg') center/cover;
            position: absolute; bottom: 140px; left: 50%;
            transform: translateX(-50%); border-radius: 15px;
            border: 3px solid #fff; box-shadow: 0 0 25px var(--neon-blue);
            z-index: 100; transition: left 0.15s ease-out;
        }

        .obstacle {
            width: 50px; height: 50px; position: absolute; top: -60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; filter: drop-shadow(0 0 10px var(--neon-pink));
            animation: fall linear forwards;
            z-index: 90;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* --- বাটন সেকশন (আপডেট করা হয়েছে) --- */
        .controls {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 30px;
            box-sizing: border-box; z-index: 500;
        }

        .move-btn {
            width: 90px; height: 90px; border-radius: 50%; /* রাউন্ড বাটন করা হয়েছে */
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.3);
            color: white; font-size: 40px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            outline: none; -webkit-tap-highlight-color: transparent;
            display: flex; align-items: center; justify-content: center;
        }

        .move-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- গেম ওভার --- */
        #game-over {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(15px); text-align: center;
        }

        .retry-btn {
            background: var(--neon-gold); color: black; border: none; padding: 15px 50px;
            border-radius: 50px; font-weight: bold; margin-top: 30px; font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 20px var(--neon-gold); cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-overlay" id="text-bg"></div>

    <div id="wish-screen">
        <div id="envelope-area" class="envelope-container" onclick="revealCard()">
            <div class="envelope"><div class="seal">🌙</div></div>
            <p style="color: var(--neon-gold); margin-top: 25px; font-weight: 300; letter-spacing: 3px;">CLICK TO UNLOCK</p>
        </div>

        <div id="message-card" class="glass-card">
            <h1 style="color: var(--neon-gold); font-family: 'Orbitron', sans-serif; margin-bottom: 10px;">ULTRA CHALLENGE</h1>
            <p style="font-size: 14px; opacity: 0.8; line-height: 1.6;">আকাশ থেকে পড়া 🖕🖕 গুলো থেকে নিজেকে বাঁচান। কন্ট্রোল বাটনগুলো নিচে দুই কোণায় দেওয়া হয়েছে।</p>
            <button class="retry-btn" onclick="startGame()">ENTER THE GRID</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="stats-bar">
            <div class="stat-item">SCORE: <span id="score">0</span></div>
            <div class="stat-item">TIME: <span id="timer">0</span>s</div>
        </div>
        <div id="player"></div>
        <div class="controls">
            <button class="move-btn" onmousedown="moveLeft()" ontouchstart="moveLeft()">◀</button>
            <button class="move-btn" onmousedown="moveRight()" ontouchstart="moveRight()">▶</button>
        </div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 45px; color: var(--neon-pink); font-family: 'Orbitron', sans-serif;">CRASHED! 🖕</h1>
        <p style="color: #00d4ff; font-weight: bold; font-size: 18px;">মেরাজ চুদলিং পং ধরা খেয়েছেন!</p>
        <div id="final-stats" style="margin-top: 15px; font-size: 20px; font-family: 'Orbitron', sans-serif;"></div>
        <button class="retry-btn" onclick="location.reload()">REBOOT SYSTEM</button>
    </div>

    <script>
        let playerPos = 50;
        let score = 0;
        let gameActive = false;
        let gameTime = 0;

        function initBG() {
            const container = document.getElementById('text-bg');
            const message = 'মেরাজ চুদলিং পং 🖕🖕';
            for(let i=0; i<15; i++) {
                const span = document.createElement('div');
                span.className = 'float-text';
                span.innerText = message;
                span.style.left = Math.random() * 85 + 'vw';
                span.style.animationDuration = (Math.random() * 5 + 7) + 's';
                span.style.animationDelay = (Math.random() * 5) + 's';
                span.style.fontSize = (Math.random() * 10 + 18) + 'px';
                container.appendChild(span);
            }
        }
        initBG();

        function revealCard() {
            document.getElementById('envelope-area').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('envelope-area').style.display = 'none';
                document.getElementById('message-card').style.display = 'block';
            }, 400);
        }

        function startGame() {
            document.getElementById('wish-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            gameActive = true;
            
            function spawnController() {
                if(!gameActive) return;
                createObstacle();
                let nextSpawn = gameTime > 120 ? 350 : (gameTime > 45 ? 500 : 750);
                setTimeout(spawnController, nextSpawn);
            }
            spawnController();

            setInterval(() => {
                if(gameActive) {
                    gameTime++;
                    score += 10;
                    document.getElementById('timer').innerText = gameTime;
                    document.getElementById('score').innerText = score;
                }
            }, 1000);

            runCollisionCheck();
        }

        function moveLeft() { if(playerPos > 15) playerPos -= 15; updatePlayer(); }
        function moveRight() { if(playerPos < 85) playerPos += 15; updatePlayer(); }
        function updatePlayer() { document.getElementById('player').style.left = playerPos + '%'; }

        function createObstacle() {
            const obs = document.createElement('div');
            obs.className = 'obstacle';
            obs.innerHTML = '🖕🖕'; 
            obs.style.left = Math.random() * 85 + 'vw';
            let fallSpeed = gameTime > 120 ? 1.0 : (gameTime > 45 ? 1.5 : 2.2);
            obs.style.animationDuration = fallSpeed + 's';
            document.getElementById('game-screen').appendChild(obs);
            setTimeout(() => obs.remove(), 2500);
        }

        function runCollisionCheck() {
            const check = setInterval(() => {
                if(!gameActive) { clearInterval(check); return; }
                const p = document.getElementById('player').getBoundingClientRect();
                const obstacles = document.getElementsByClassName('obstacle');

                for(let o of obstacles) {
                    const r = o.getBoundingClientRect();
                    if(!(r.right < p.left + 10 || r.left > p.right - 10 || r.bottom < p.top + 10 || r.top > p.bottom - 10)) {
                        endGame();
                    }
                }
            }, 30);
        }

        function endGame() {
            gameActive = false;
            document.getElementById('final-stats').innerHTML = `FINAL SCORE: ${score}<br>TIME: ${gameTime}s`;
            document.getElementById('game-over').style.display = 'flex';
        }
    </script>
</body>
</html>
